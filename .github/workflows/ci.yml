name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  date-helpers:
    name: Date helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Civil-date tests
        run: npx --yes tsx --test lib/booking-dates.test.ts
